[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "membrane"
version = "0.1.1"
description = "Membrane — prompt engineering infrastructure: token budgets, U-shaped layout, prompt caching, and mid-generation retrieval for LLM applications."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [{ name = "Adeyomi Lawal" }]
keywords = ["llm", "prompt", "context", "tiktoken", "caching", "rag", "membrane", "Harness"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "tiktoken>=0.5.0",
]

[project.scripts]
membrane = "membrane.cli.main:main"

[project.optional-dependencies]
lod = ["numpy>=1.24.0", "fastembed>=0.2.0"]
redis = ["redis>=4.0.0"]
stress = ["psutil>=5.9.0"]
pydantic = ["pydantic>=2.0.0"]
llm-openai = ["openai>=1.0.0"]
llm-anthropic = ["anthropic>=0.20.0"]
langchain = ["langchain-core>=0.2.0"]
llamaindex = ["llama-index-core>=0.10.0"]
crewai = ["crewai>=0.41.0"]
haystack = ["haystack-ai>=2.0.0"]
tokenizers = ["sentencepiece>=0.1.99", "transformers>=4.35.0"]
mcp = ["mcp>=1.0.0"]
all = [
    "numpy>=1.24.0",
    "fastembed>=0.2.0",
    "redis>=4.0.0",
    "psutil>=5.9.0",
    "pydantic>=2.0.0",
    "openai>=1.0.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]

[project.urls]
Homepage = "https://github.com/adeyomilawal/membrane"
Source = "https://github.com/adeyomilawal/membrane"
Issues = "https://github.com/adeyomilawal/membrane/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/membrane"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "requires_extras: tests that need optional dependency stacks (mcp, langchain, etc.) not installed in minimal CI",
]

[tool.ruff.lint.per-file-ignores]
# importorskip must run before adapter imports that depend on optional deps
"tests/test_mcp_server.py" = ["E402"]
