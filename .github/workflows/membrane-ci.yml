# Install, lint, and test the standalone Membrane package on push/PR.
name: Membrane CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        install: [core, dev]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Verify uv lock
        uses: astral-sh/setup-uv@v6

      - run: uv lock --check

      - name: Install package (no extras — core matrix)
        if: matrix.install == 'core'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install "pytest>=7.0.0" "pytest-asyncio>=0.21.0"

      - name: Install package and dev dependencies
        if: matrix.install == 'dev'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff check
        if: matrix.install == 'dev'
        run: python -m ruff check src tests

      - name: Pytest (minimal deps — excludes requires_extras)
        if: matrix.install == 'core'
        run: python -m pytest -m "not requires_extras"

      - name: Pytest (full)
        if: matrix.install == 'dev'
        run: python -m pytest
