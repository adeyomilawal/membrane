name: Bug report
description: Something in Membrane doesn't work as documented.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: The smallest code that shows the problem. Remove secrets and private data.
      render: python
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: membrane-aol version
      placeholder: "0.2.0"
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Python version, OS and model id
      placeholder: "3.12, macOS 15, openai/gpt-4o"
  - type: textarea
    id: logs
    attributes:
      label: Logs or traceback
      render: text
